name: saffrodex-release

on:
  push:
    tags:
      - "saffrodex-v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build - ${{ matrix.runner }} - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Install Rust target
        shell: bash
        run: rustup target add ${{ matrix.target }}

      - name: Install sccache
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: sccache
          version: 0.7.5

      - name: Validate Saffrodex tag and Codex base
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#saffrodex-v}"
          pattern='^([0-9]+\.[0-9]+\.[0-9]+(-(alpha(\.[0-9]+){0,2}|beta(\.[0-9]+)?))?)\+saffrodex\.([0-9]+)$'
          if [[ ! "${version}" =~ ${pattern} ]]; then
            echo "Saffrodex tags must have the form saffrodex-v<codex-version>+saffrodex.<release>." >&2
            exit 1
          fi

          codex_version="${BASH_REMATCH[1]}"
          codex_tag="rust-v${codex_version}"
          git fetch --no-tags https://github.com/openai/codex.git \
            "refs/tags/${codex_tag}:refs/tags/${codex_tag}"
          codex_commit=$(git rev-parse "${codex_tag}^{}")
          git merge-base --is-ancestor "${codex_commit}" "${GITHUB_SHA}" || {
            echo "${codex_tag} is not an ancestor of ${GITHUB_REF_NAME}." >&2
            exit 1
          }

      - name: Set package version from tag
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#saffrodex-v}"
          python3 - "${version}" <<'PY'
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          manifest_path = Path("Cargo.toml")
          manifest = manifest_path.read_text()
          manifest = re.sub(
              r'^version = "[^"]+"$',
              f'version = "{version}"',
              manifest,
              count=1,
              flags=re.MULTILINE,
          )
          manifest_path.write_text(manifest)

          path = Path("Cargo.lock")
          text = path.read_text()

          def replace_workspace_package_version(match: re.Match[str]) -> str:
              block = match.group(0)
              name_match = re.search(r'^name = "([^"]+)"$', block, flags=re.MULTILINE)
              if name_match is None:
                  return block
              name = name_match.group(1)
              if not (
                  name.startswith("codex-")
                  or name in {"app_test_support", "core_test_support"}
              ):
                  return block
              return re.sub(
                  r'^version = "[^"]+"$',
                  f'version = "{version}"',
                  block,
                  count=1,
                  flags=re.MULTILINE,
              )

          text = re.sub(
              r'(?ms)^\[\[package\]\]\n.*?(?=^\[\[package\]\]\n|\Z)',
              replace_workspace_package_version,
              text,
          )
          path.write_text(text)
          PY
          grep -n "^version = \"${version}\"" Cargo.toml

      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Cargo build
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            cargo build --jobs 2 --target ${{ matrix.target }} --release --timings \
              --bin codex --bin codex-code-mode-host
          else
            cargo build --target ${{ matrix.target }} --release --timings \
              --bin codex --bin codex-code-mode-host
          fi

      - name: Upload Cargo timings
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cargo-timings-saffrodex-release-${{ matrix.target }}
          path: codex-rs/target/**/cargo-timings/cargo-timing.html
          if-no-files-found: warn

      - name: Build code-mode host JavaScript test
        shell: bash
        run: |
          set -euo pipefail
          cargo test --target ${{ matrix.target }} --release \
            -p codex-code-mode-host --test stdio --no-run

      - name: Verify Saffrodex version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#saffrodex-v}"
          actual=$(target/${{ matrix.target }}/release/codex --version)
          expected="codex-cli ${version}"
          [[ "${actual}" == "${expected}" ]] || {
            echo "expected version '${expected}', got '${actual}'" >&2
            exit 1
          }

      - name: Sign and verify macOS code-mode host
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          host="target/${{ matrix.target }}/release/codex-code-mode-host"
          entitlements="${GITHUB_WORKSPACE}/.github/scripts/macos-signing/codex-code-mode-host.entitlements.plist"
          actual=$(mktemp)
          normalized_actual=$(mktemp)
          normalized_expected=$(mktemp)
          trap 'rm -f "$actual" "$normalized_actual" "$normalized_expected"' EXIT

          codesign --force --sign - --identifier codex-code-mode-host \
            --options runtime --timestamp=none --entitlements "$entitlements" "$host"
          codesign --verify --strict --verbose=2 "$host"
          codesign -d --entitlements :- "$host" >"$actual"
          plutil -convert xml1 -o "$normalized_actual" "$actual"
          plutil -convert xml1 -o "$normalized_expected" "$entitlements"
          cmp "$normalized_actual" "$normalized_expected"

      - name: Verify code-mode host executes JavaScript
        shell: bash
        run: |
          set -euo pipefail
          test_binary=""
          for candidate in target/${{ matrix.target }}/release/deps/stdio-*; do
            if [[ -f "$candidate" && -x "$candidate" ]]; then
              test_binary="$candidate"
              break
            fi
          done
          [[ -n "$test_binary" ]] || {
            echo "code-mode host integration test executable not found" >&2
            exit 1
          }
          "$test_binary" \
            remote_session_persists_values_forwards_delegates_and_controls_cells --exact

      - name: Stage archive
        shell: bash
        run: |
          set -euo pipefail
          dest="${GITHUB_WORKSPACE}/dist/${{ matrix.target }}"
          mkdir -p "${dest}"
          tar -C "target/${{ matrix.target }}/release" \
            -czf "${dest}/saffrodex-${{ matrix.target }}.tar.gz" \
            codex codex-code-mode-host

          entries=$(tar -tzf "${dest}/saffrodex-${{ matrix.target }}.tar.gz")
          [[ "$entries" == $'codex\ncodex-code-mode-host' ]]

      - name: Report sccache statistics
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          {
            echo "### sccache stats — ${{ matrix.target }}";
            echo;
            echo '```text';
            sccache --show-stats;
            echo '```';
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: saffrodex-${{ matrix.target }}
          path: dist/${{ matrix.target }}/*

  release:
    needs: build
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: List staged artifacts
        shell: bash
        run: find dist -type f -print

      - name: Write release provenance
        id: provenance
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#saffrodex-v}"
          codex_version="${version%+saffrodex.*}"
          codex_tag="rust-v${codex_version}"
          git fetch --no-tags https://github.com/openai/codex.git \
            "refs/tags/${codex_tag}:refs/tags/${codex_tag}"
          codex_commit=$(git rev-parse "${codex_tag}^{}")
          git merge-base --is-ancestor "${codex_commit}" "${GITHUB_SHA}"

          body_path="${RUNNER_TEMP}/saffrodex-release.md"
          {
            echo "Based on OpenAI Codex \`${codex_tag}\` (\`${codex_commit}\`)."
            if [[ $(git cat-file -t "${GITHUB_REF_NAME}") == tag ]]; then
              printf '\n'
              git for-each-ref --format='%(contents)' \
                "refs/tags/${GITHUB_REF_NAME}"
            fi
          } >"${body_path}"
          echo "body_path=${body_path}" >>"${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          body_path: ${{ steps.provenance.outputs.body_path }}
          files: dist/**
          prerelease: true
