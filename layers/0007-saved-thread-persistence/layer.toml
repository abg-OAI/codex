[vcs]
commit-msg = '''
Preserve persistence for saved thread resumes

Use target-owned persistence intent when an agent cold-loads an
evicted thread, so ephemeral sender config cannot strip durability.
Repair saved threads already loaded without a writer in place and
reconcile accepted live history before public read or resume exposes it.
'''

[[operation]]
[operation.patch]
file = "patch"

[[operation]]
[operation.overlay]
directory = "overlay"

[[operation]]
[operation.patch]
file = "refresh.patch"

[[operation]]
[operation.patch]
file = "refresh-1.patch"
