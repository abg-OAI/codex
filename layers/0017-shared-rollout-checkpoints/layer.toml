[vcs]
commit-msg = '''
rollouts: Bound checkpoint reads across shared history

Native paginated forks share inherited transcript files, but current
context reads can still resolve old ancestry before finding a usable
checkpoint.
Probe the selected physical file or frozen prefix first, stopping at a
complete native replacement checkpoint and its required companions.
Incomplete or oversized probes and historical boundaries retain native
reconstruction, so the read bound never truncates model context.

Capture child state during fork initialization, retaining effective
settings and interruption evidence without replaying startup model
items twice.
Copied paginated subagents already have a self-contained prefix and do
not need another copy.
Compaction uses its existing native checkpoint; rollback keeps its
native continuation at the retained historical boundary.

Compaction seals the projected prefix even during an active turn. The
successor keeps the thread identity and creation time and references
the older file. Turn summaries span the visible segments. Daemon
recovery checks the saved turn through same-thread references.

The live writer owns both files until publication is resolved.
Later writes reconcile an uncertain result before choosing a recorder;
a positively rejected candidate is stopped and removed.
Predecessors remain immutable and existing native reference sharing
supplies fork disk savings without database or wire-format changes.
'''

[[operation]]
[operation.patch]
file = "patch"

[[operation]]
[operation.overlay]
directory = "overlay"

[[operation]]
[operation.patch]
file = "refresh.patch"
